name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 17:30 giờ Việt Nam, sau khi thị trường đóng cửa.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Tùy chọn. API key nâng hạn mức của nguồn từ 20 lên 60 lượt/phút.
      # Không có key vẫn chạy được, chỉ là pipeline đi chậm hơn.
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ba phép thử rẻ trước khi gọi 30 mã: nếu API hỏng thì dừng ngay tại đây.
      - name: Check API connectivity first
        run: python scripts/check_api.py

      # Ba lượt gọi trên nằm cùng cửa sổ một phút với pipeline. Nguồn giới hạn
      # 20 lượt/phút cho gói Khách nên phải để cửa sổ trôi qua trước khi chạy tiếp.
      - name: Let the API rate-limit window clear
        run: sleep 60

      # Lấy danh sách VN30 hiện tại, hai chỉ số và giá từng cổ phiếu thành phần.
      # Thoát khác 0 nếu dữ liệu chưa đầy đủ.
      - name: Update VNINDEX, VN30 index and the current VN30 constituents
        timeout-minutes: 30
        run: python scripts/update_data.py

      # Chốt chặn: không được commit trạng thái 0/30 cổ phiếu rồi báo thành công.
      - name: Validate the data set before committing
        run: python scripts/validate_data.py

      - name: Commit data in a single commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/reference data/processed
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
            exit 0
          fi
          stocks=$(git ls-files data/raw/stocks | wc -l)
          staged=$(git diff --cached --name-only | wc -l)
          git commit -m "Update market data ($stocks VN30 stock files, $staged files changed)"
          git push

      # Chạy sau khi commit để trạng thái cuối cùng luôn hiện trong log,
      # kể cả khi có bước phía trên thất bại.
      - name: Data quality report
        if: always()
        run: python scripts/validate_data.py --report
