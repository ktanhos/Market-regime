name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 17:30 giờ Việt Nam, sau khi thị trường đóng cửa.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API connectivity first
        run: python scripts/check_api.py

      - name: Update VNINDEX, VN30 and the current VN30 constituents
        run: python scripts/update_data.py

      - name: Data quality report
        if: always()
        run: python scripts/validate_data.py || true

      - name: Commit data in a single commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update market data"
          git push
