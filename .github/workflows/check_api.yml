name: Check vnstock API

# Chạy thủ công để xác nhận giao diện vnstock đang dùng vẫn hoạt động thật.
# Không ghi dữ liệu, không commit.
on:
  workflow_dispatch:
  # Tạm thời bật để xác minh giao diện vnstock trên nhánh rebuild. Sẽ gỡ ngay sau đó.
  push:
    branches:
      - claude/market-regime-audit-lbavr0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe VNINDEX, FPT and the VN30 constituent list
        run: python scripts/check_api.py
